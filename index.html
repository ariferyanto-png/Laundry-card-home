<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laundry 3D Manager - Laporan Keuangan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f0f4f8;
            color: #334155;
            -webkit-tap-highlight-color: transparent;
        }

        .card-3d {
            background: #ffffff;
            border-radius: 20px;
            box-shadow:  12px 12px 24px #d1d5db, -12px -12px 24px #ffffff;
            border: 1px solid rgba(255,255,255,0.8);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .btn-3d {
            border-radius: 12px;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            transition: all 0.1s ease;
            position: relative;
            top: 0;
        }

        .btn-3d-primary {
            background: linear-gradient(145deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            box-shadow: 0 6px 0 #0284c7, 0 10px 15px rgba(0,0,0,0.2);
        }
        .btn-3d-primary:active {
            top: 6px;
            box-shadow: 0 0 0 #0284c7, 0 4px 6px rgba(0,0,0,0.2);
        }

        .btn-3d-success {
            background: linear-gradient(145deg, #10b981 0%, #34d399 100%);
            color: white;
            box-shadow: 0 6px 0 #059669, 0 10px 15px rgba(0,0,0,0.2);
        }
        .btn-3d-success:active { top: 6px; box-shadow: 0 0 0 #059669; }

        .btn-3d-danger {
            background: linear-gradient(145deg, #ef4444 0%, #f87171 100%);
            color: white;
            box-shadow: 0 6px 0 #b91c1c, 0 10px 15px rgba(0,0,0,0.2);
        }
        .btn-3d-danger:active { top: 6px; box-shadow: 0 0 0 #b91c1c; }

        .btn-3d-warning {
            background: linear-gradient(145deg, #f59e0b 0%, #fbbf24 100%);
            color: white;
            box-shadow: 0 6px 0 #b45309, 0 10px 15px rgba(0,0,0,0.2);
        }
        .btn-3d-warning:active { top: 6px; box-shadow: 0 0 0 #b45309; }

        .btn-3d-outline {
            background: #ffffff;
            color: #334155;
            border: 2px solid #e2e8f0;
            box-shadow: 0 4px 0 #cbd5e1, 0 8px 10px rgba(0,0,0,0.05);
        }
        .btn-3d-outline:active { top: 4px; box-shadow: 0 0 0 #cbd5e1; }

        .input-3d {
            background: #f8fafc;
            border: 2px solid transparent;
            border-radius: 12px;
            box-shadow: inset 3px 3px 6px #cbd5e1, inset -3px -3px 6px #ffffff;
            padding: 0.75rem 1rem;
            outline: none;
            transition: all 0.2s;
        }
        .input-3d:focus {
            border-color: #4facfe;
            box-shadow: inset 1px 1px 3px #cbd5e1, inset -1px -1px 3px #ffffff, 0 0 0 3px rgba(79, 172, 254, 0.2);
        }

        .icon-3d {
            width: 48px; height: 48px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px;
            box-shadow: 4px 4px 10px rgba(0,0,0,0.1), -4px -4px 10px #ffffff;
        }
        
        .icon-blue { background: linear-gradient(135deg, #60a5fa, #3b82f6); color: white; }
        .icon-green { background: linear-gradient(135deg, #34d399, #10b981); color: white; }
        .icon-red { background: linear-gradient(135deg, #f87171, #ef4444); color: white; }
        .icon-yellow { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: white; }
        .icon-purple { background: linear-gradient(135deg, #a78bfa, #8b5cf6); color: white; }

        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area {
                position: absolute; left: 0; top: 0; width: 58mm;
                padding: 0; margin: 0; font-family: 'Courier New', Courier, monospace;
                font-size: 12px; color: black !important; line-height: 1.2;
            }
            @page { size: 58mm auto; margin: 0mm; }
            .no-print { display: none !important; }
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .hide { display: none !important; }
        .modal-overlay { background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(4px); }

        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden bg-[#f0f4f8]">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, addDoc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'laundry-app-v1';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        let initialToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        let app, db, auth, currentUserId = 'demo_user';
        let isOnline = false;

        if (firebaseConfig.apiKey) {
            try {
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                isOnline = true;
            } catch (e) {
                console.error("Gagal inisialisasi Firebase", e);
            }
        }

        window.AppState = {
            settings: { 
                outletName: 'Laundry Ku 3D', 
                address: 'Jl. Estetik No. 123', 
                phone: '08123456789',
                receiptFooter: 'Terima Kasih!\nBarang yang tidak diambil >1 bulan bukan tanggung jawab kami.',
                showLogo: true,
                showAddress: true,
                showPhone: true,
                showCustomerName: true,
                showCashierName: true,
                showParfum: true
            },
            services: [],
            customers: [],
            employees: [],
            transactions: [],
            listeners: []
        };

        async function initApp() {
            showLoading(true);
            if (isOnline) {
                try {
                    if (initialToken) {
                        await signInWithCustomToken(auth, initialToken);
                    } else {
                        await signInAnonymously(auth);
                    }
                    
                    onAuthStateChanged(auth, (user) => {
                        if (user) {
                            currentUserId = user.uid;
                            setupRealtimeListeners();
                        }
                    });
                } catch (error) {
                    console.error("Auth error:", error);
                    showToast("Gagal terhubung ke Cloud. Berjalan di mode offline.", "warning");
                    loadDummyData();
                    renderDashboard();
                }
            } else {
                loadDummyData();
                renderDashboard();
            }
            showLoading(false);
            initRouter();
        }

        const getColPath = (colName) => collection(db, 'artifacts', appId, 'users', currentUserId, colName);
        const getDocPath = (colName, docId) => doc(db, 'artifacts', appId, 'users', currentUserId, colName, docId);

        function setupRealtimeListeners() {
            AppState.listeners.forEach(unsub => unsub());
            AppState.listeners = [];

            if (!db) return;

            const unsubSettings = onSnapshot(getDocPath('settings', 'main'), (docSnap) => {
                if (docSnap.exists()) {
                    AppState.settings = { ...AppState.settings, ...docSnap.data() };
                } else {
                    setDoc(getDocPath('settings', 'main'), AppState.settings).catch(e => console.error(e));
                }
                updateUIStoreInfo();
            }, err => console.error("Snapshot error settings:", err));
            AppState.listeners.push(unsubSettings);

            const unsubServices = onSnapshot(getColPath('services'), (snapshot) => {
                AppState.services = [];
                snapshot.forEach(doc => AppState.services.push({ id: doc.id, ...doc.data() }));
                if(currentView === 'services') renderServices();
            }, err => console.error("Error services:", err));
            AppState.listeners.push(unsubServices);

            const unsubCustomers = onSnapshot(getColPath('customers'), (snapshot) => {
                AppState.customers = [];
                snapshot.forEach(doc => AppState.customers.push({ id: doc.id, ...doc.data() }));
                if(currentView === 'customers') renderCustomers();
            }, err => console.error("Error customers:", err));
            AppState.listeners.push(unsubCustomers);
            
            const unsubEmployees = onSnapshot(getColPath('employees'), (snapshot) => {
                AppState.employees = [];
                snapshot.forEach(doc => AppState.employees.push({ id: doc.id, ...doc.data() }));
                if(currentView === 'employees') renderEmployees();
            }, err => console.error("Error employees:", err));
            AppState.listeners.push(unsubEmployees);

            const unsubTransactions = onSnapshot(getColPath('transactions'), (snapshot) => {
                AppState.transactions = [];
                snapshot.forEach(doc => AppState.transactions.push({ id: doc.id, ...doc.data() }));
                AppState.transactions.sort((a,b) => new Date(b.date) - new Date(a.date));
                
                if(currentView === 'dashboard') renderDashboard();
                if(currentView === 'transactions') renderTransactions();
                if(currentView === 'reports') renderReports();
            }, err => console.error("Error transactions:", err));
            AppState.listeners.push(unsubTransactions);
        }

        window.DB = {
            saveSetting: async (data) => {
                AppState.settings = { ...AppState.settings, ...data };
                if (isOnline) await setDoc(getDocPath('settings', 'main'), AppState.settings);
                updateUIStoreInfo();
                showToast("Pengaturan disimpan");
            },
            addService: async (data) => {
                if (isOnline) await addDoc(getColPath('services'), data);
                else AppState.services.push({id: Date.now().toString(), ...data});
                showToast("Layanan ditambahkan");
            },
            updateService: async (id, data) => {
                if (isOnline) await updateDoc(getColPath('services', id), data);
                else {
                    const idx = AppState.services.findIndex(s => s.id === id);
                    if(idx > -1) AppState.services[idx] = {...AppState.services[idx], ...data};
                }
                showToast("Layanan diupdate");
            },
            deleteService: async (id) => {
                if (isOnline) await deleteDoc(getColPath('services', id));
                else AppState.services = AppState.services.filter(s => s.id !== id);
                showToast("Layanan dihapus");
            },
            addCustomer: async (data) => {
                if (isOnline) await addDoc(getColPath('customers'), data);
                else AppState.customers.push({id: Date.now().toString(), ...data});
                showToast("Pelanggan ditambahkan");
            },
            addEmployee: async (data) => {
                if (isOnline) await addDoc(getColPath('employees'), data);
                else AppState.employees.push({id: Date.now().toString(), ...data});
                showToast("Karyawan ditambahkan");
            },
            saveTransaction: async (data) => {
                if (isOnline) {
                    data.createdAt = serverTimestamp();
                    const ref = await addDoc(getColPath('transactions'), data);
                    showToast("Transaksi berhasil dibuat");
                    return ref.id;
                } else {
                    data.id = Date.now().toString();
                    AppState.transactions.unshift(data);
                    showToast("Transaksi berhasil dibuat (Offline)");
                    return data.id;
                }
            },
            updateTransactionStatus: async (id, newStatus, paymentUpdate = null) => {
                const updateData = { status: newStatus };
                if (paymentUpdate) Object.assign(updateData, paymentUpdate);

                if (isOnline) {
                    await updateDoc(getDocPath('transactions', id), updateData);
                } else {
                    const tr = AppState.transactions.find(t => t.id === id);
                    if(tr) {
                        tr.status = newStatus;
                        if(paymentUpdate) Object.assign(tr, paymentUpdate);
                    }
                }
                showToast(`Status transaksi diubah: ${newStatus}`);
                if(currentView === 'transactions') renderTransactions();
                if(currentView === 'reports') renderReports();
            }
        };

        function loadDummyData() {
            if(AppState.services.length === 0) {
                AppState.services = [
                    { id: '1', name: 'Cuci Komplit', category: 'Kiloan', price: 6000, unit: 'Kg', estimasi: 2 },
                    { id: '2', name: 'Cuci Kering', category: 'Kiloan', price: 4000, unit: 'Kg', estimasi: 1 },
                    { id: '3', name: 'Setrika Saja', category: 'Kiloan', price: 3000, unit: 'Kg', estimasi: 1 },
                    { id: '4', name: 'Bed Cover Besar', category: 'Satuan', price: 25000, unit: 'Pcs', estimasi: 3 }
                ];
            }
            if(AppState.customers.length === 0) {
                AppState.customers = [
                    { id: 'c1', name: 'Budi Santoso', phone: '08122334455', address: 'Jl. Merdeka 1' },
                    { id: 'c2', name: 'Siti Rahma', phone: '085711223344', address: 'Jl. Mawar No. 12' }
                ];
            }
            if(AppState.employees.length === 0) {
                AppState.employees = [
                    { id: 'e1', name: 'Admin Utama', role: 'Kasir', phone: '0812345678' }
                ];
            }
            if(AppState.transactions.length === 0) {
                const today = new Date().toISOString();
                AppState.transactions = [
                    { id: 't1', date: today, customerId: 'c1', items: [{serviceId: '1', qty: 5, price: 6000, total: 30000}], grandTotal: 30000, amountPaid: 30000, paymentStatus: 'lunas', paymentMethod: 'Tunai', status: 'proses', cashier: 'Admin Utama' },
                    { id: 't2', date: today, customerId: 'c2', items: [{serviceId: '4', qty: 2, price: 25000, total: 50000}], grandTotal: 50000, amountPaid: 20000, paymentStatus: 'dp', paymentMethod: 'Transfer', status: 'antrian', cashier: 'Admin Utama' }
                ];
            }
        }

        window.addEventListener('DOMContentLoaded', initApp);
    </script>

    <div id="loading-overlay" class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center hide transition-opacity">

            <div class="w-12 h-12 border-4 border-blue-200 border-t-blue-500 rounded-full animate-spin mb-4"></div>

    <!-- Area Tersembunyi Khusus Untuk Cetak/Print Nota Thermal -->
    <div id="print-area" class="no-print bg-white"></div>

    <script>
        let currentView = 'dashboard';

        const formatRupiah = (angka) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka || 0);
        const formatDate = (dateStr) => {
            if(!dateStr) return '-';
            const d = new Date(dateStr);
            return d.toLocaleDateString('id-ID', {day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'});
        };

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let bgColors = 'bg-emerald-500 text-white';
            let icon = '✅';
            if (type === 'error') { bgColors = 'bg-red-500 text-white'; icon = '❌'; }
            else if (type === 'warning') { bgColors = 'bg-yellow-500 text-white'; icon = '⚠️'; }
            
            toast.className = `px-4 py-3 rounded-xl shadow-lg transform transition-all duration-300 translate-x-full ${bgColors} font-bold text-sm flex items-center gap-2`;
            toast.innerHTML = `<span>${icon}</span> ${message}`;
            container.appendChild(toast);
            
            requestAnimationFrame(() => {
                toast.classList.remove('translate-x-full');
            });
            setTimeout(() => {
                toast.classList.add('translate-x-full');
                toast.classList.add('opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        function showLoading(show) {
            const el = document.getElementById('loading-overlay');
            if(show) el.classList.remove('hide');
            else setTimeout(() => el.classList.add('hide'), 300);
        }

        function updateUIStoreInfo() {
            document.getElementById('ui-store-name').innerText = window.AppState.settings.outletName || 'Laundry App';
        }

        function initRouter() {
            const hash = window.location.hash.replace('#', '') || 'dashboard';
            navigate(hash);
        }

        // Script Navigasi yang telah diubah untuk efek Tab Aktif Bottom Dock 3D
        function navigate(view) {
            currentView = view;
            window.location.hash = view;
            
            document.querySelectorAll('.nav-item').forEach(el => {
                // Menghapus state aktif (Efek tombol tertekan 3D)
                el.classList.remove('bg-blue-50', 'text-blue-600', 'bg-emerald-50', 'text-emerald-700', 'bg-slate-100', 'text-slate-800', 'shadow-inner', 'scale-95');
                el.classList.add('text-slate-500', 'hover:bg-slate-50');
                
                if(el.getAttribute('href') === `#${view}`) {
                    el.classList.remove('text-slate-500', 'hover:bg-slate-50');
                    
                    // Menambah efek tombol tertekan ke dalam (shadow-inner & scale-95)
                    if(view === 'reports') {
                        el.classList.add('bg-emerald-50', 'text-emerald-700', 'shadow-inner', 'scale-95');
                    } else if(view === 'new-trx') {
                        el.classList.add('bg-blue-50', 'text-blue-600', 'shadow-inner', 'scale-95');
                    } else {
                        el.classList.add('bg-slate-100', 'text-slate-800', 'shadow-inner', 'scale-95');
                    }
                }
            });

            const container = document.getElementById('view-container');
            container.style.opacity = 0;
            
            setTimeout(() => {
                switch(view) {
                    case 'dashboard': renderDashboard(); break;
                    case 'new-trx': renderNewTransaction(); break;
                    case 'transactions': renderTransactions(); break;
                    case 'services': renderServices(); break;
                    case 'customers': renderCustomers(); break;
                    case 'employees': renderEmployees(); break;
                    case 'reports': renderReports(); break;
                    case 'settings': renderSettings(); break;
                    default: renderDashboard();
                }
                container.style.transition = 'opacity 0.3s ease';
                container.style.opacity = 1;
            }, 150);
        }

        function Modal(id, title, contentHTML, actionsHTML = '') {
            return `
            <div id="${id}" class="fixed inset-0 z-50 flex items-center justify-center p-4 hide">
                <div class="fixed inset-0 modal-overlay" onclick="closeModal('${id}')"></div>
                <div class="card-3d w-full max-w-lg relative z-10 flex flex-col max-h-[90vh]">
                    <div class="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50/50 rounded-t-[20px]">
                        <h3 class="text-xl font-extrabold text-slate-800">${title}</h3>
                        <button onclick="closeModal('${id}')" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-200 text-slate-500 transition-colors">✕</button>
                    </div>
                    <div class="p-5 overflow-y-auto">
                        ${contentHTML}
                    </div>
                    ${actionsHTML ? `<div class="p-5 border-t border-slate-100 bg-slate-50/50 rounded-b-[20px] flex justify-end gap-3 flex-wrap">${actionsHTML}</div>` : ''}
                </div>
            </div>
            `;
        }

        window.openModal = function(id) { document.getElementById(id).classList.remove('hide'); }
        window.closeModal = function(id) { document.getElementById(id).classList.add('hide'); }

        // State untuk Filter Rentang Tanggal Dashboard
        window.dashboardFilterStartDate = window.dashboardFilterStartDate || new Date().toISOString().split('T')[0];
        window.dashboardFilterEndDate = window.dashboardFilterEndDate || new Date().toISOString().split('T')[0];

        // ------------- COMPONENT: DASHBOARD -------------
        function renderDashboard() {
            const container = document.getElementById('view-container');
            const trx = window.AppState.transactions;
            
            let omsetHariIni = 0; 
            let piutangHariIni = 0; 
            let transaksiHariIni = 0;
            
            let countMasuk = 0;
            let countLunas = 0;
            let countBatal = 0;
            let countProses = 0;
            let countTerlambat = 0; 

            const selectedStartDateStr = window.dashboardFilterStartDate || new Date().toISOString().split('T')[0];
            const selectedEndDateStr = window.dashboardFilterEndDate || new Date().toISOString().split('T')[0];
            
            const startD = new Date(selectedStartDateStr); startD.setHours(0,0,0,0);
            const endD = new Date(selectedEndDateStr); endD.setHours(23,59,59,999);
            const now = new Date();

            trx.forEach(t => {
                const trxDateObj = new Date(t.date);
                const isWithinRange = trxDateObj >= startD && trxDateObj <= endD;

                if (t.status !== 'batal') {
                    countMasuk++;
                    
                    if (isWithinRange) {
                        transaksiHariIni++;
                        omsetHariIni += Number(t.amountPaid || 0);
                        
                        if (t.paymentStatus === 'dp') {
                            piutangHariIni += (Number(t.grandTotal) - Number(t.amountPaid));
                        } else if (t.paymentStatus === 'belum') {
                            piutangHariIni += Number(t.grandTotal);
                        }
                    }

                    if (t.paymentStatus === 'lunas') {
                        countLunas++;
                    } 
                    
                    if (['antrian', 'proses'].includes(t.status)) countProses++;

                    if (['antrian', 'proses', 'siap'].includes(t.status)) {
                        let maxEst = 1; 
                        t.items.forEach(i => {
                            const s = window.AppState.services.find(ser => ser.id === i.serviceId);
                            if (s && s.estimasi > maxEst) maxEst = s.estimasi;
                        });
                        
                        const expectedDate = new Date(trxDateObj.getTime() + (maxEst * 24 * 60 * 60 * 1000));
                        if (now > expectedDate) {
                            countTerlambat++;
                        }
                    }
                } else {
                    countBatal++;
                }
            });

            // Widget bentuk Kotak (Grid) untuk Keuangan
            const squareWidget = (title, value, icon, colorClass, onClickAttr = '') => `
                <div ${onClickAttr} class="card-3d p-3.5 flex flex-col justify-between relative overflow-hidden group cursor-pointer hover:shadow-lg transition-all h-28 bg-white">
                    <div class="flex justify-start">
                        <div class="icon-3d w-10 h-10 text-lg ${colorClass} shadow-inner shrink-0">${icon}</div>
                    </div>
                    <div class="text-left mt-2">
                        <p class="text-[10px] md:text-xs font-bold text-slate-500 leading-tight mb-0.5">${title}</p>
                        <h3 class="text-sm md:text-base font-extrabold text-slate-800 truncate">${value}</h3>
                    </div>
                </div>
            `;

            // Widget bentuk Ikon Aksi Cepat untuk Status Transaksi
            const quickActionWidget = (title, value, icon, onClickAttr = '') => `
                <div ${onClickAttr} class="flex flex-col items-center justify-center cursor-pointer group w-[70px]">
                    <div class="card-3d w-12 h-12 rounded-2xl flex items-center justify-center text-xl mb-2 group-hover:scale-105 transition-transform relative bg-white">
                        ${icon}
                        <span class="absolute -top-1.5 -right-1.5 bg-red-500 text-white text-[9px] font-bold px-1.5 py-0.5 rounded-full shadow-md min-w-[18px] text-center border-2 border-white">${value}</span>
                    </div>
                    <span class="text-[10px] font-bold text-slate-600 text-center leading-tight">${title}</span>
                </div>
            `;

            container.innerHTML = `
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                    <div>
                        
                    <div class="flex items-center gap-2 bg-white p-2 rounded-xl border border-slate-200 shadow-sm flex-wrap w-full md:w-auto">
                        <span class="text-xs font-bold text-slate-500 pl-1">📅 Periode:</span>
                        <input type="date" id="dash-filter-start" value="${selectedStartDateStr}" class="input-3d py-1 px-2 text-xs font-bold w-full sm:w-auto flex-1" onchange="window.dashboardFilterStartDate = this.value; renderDashboard();">
                        <span class="text-xs font-bold text-slate-400 text-center w-full sm:w-auto">s/d</span>
                        <input type="date" id="dash-filter-end" value="${selectedEndDateStr}" class="input-3d py-1 px-2 text-xs font-bold w-full sm:w-auto flex-1" onchange="window.dashboardFilterEndDate = this.value; renderDashboard();">
                    </div>
                </div>

                <h2 class="text-lg font-extrabold text-slate-700 mb-3 flex items-center gap-2">💰 Keuangan (Periode)</h2>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4 mb-6">
                    ${squareWidget('Total Transaksi', transaksiHariIni, '📋', 'icon-blue', 'onclick="openTodayDetailModal(\'all\')"')}
                    ${squareWidget('Total Omset', formatRupiah(omsetHariIni), '💸', 'icon-green', 'onclick="openTodayDetailModal(\'omset\')"')}
                    ${squareWidget('Total Piutang', formatRupiah(piutangHariIni), '🧾', 'icon-yellow', 'onclick="openTodayDetailModal(\'piutang\')"')}
                    ${squareWidget('Total Pelanggan', window.AppState.customers.length, '👥', 'icon-purple', 'onclick="navigate(\'customers\')"')}
                </div>

                <h2 class="text-lg font-extrabold text-slate-700 mb-3 flex items-center gap-2">⚡ Status Transaksi</h2>
                <div class="card-3d p-4 mb-8">
                    <div class="flex flex-wrap justify-between md:justify-start md:gap-8 gap-2">
                        ${quickActionWidget('Proses', countProses, '⏳', 'onclick="openOverallDetailModal(\'proses\')"')}
                        ${quickActionWidget('Terlambat', countTerlambat, '⏰', 'onclick="openOverallDetailModal(\'terlambat\')"')}
                        ${quickActionWidget('Lunas', countLunas, '✅', 'onclick="openOverallDetailModal(\'lunas\')"')}
                        ${quickActionWidget('Batal', countBatal, '❌', 'onclick="openOverallDetailModal(\'batal\')"')}
                    </div>
                </div>

                <div id="modal-dashboard-container"></div>
            `;
        }

        window.openTodayDetailModal = function(type = 'all') {
            const trx = window.AppState.transactions;
            const customers = window.AppState.customers;
            const services = window.AppState.services;
            
            const selectedStartDateStr = window.dashboardFilterStartDate || new Date().toISOString().split('T')[0];
            const selectedEndDateStr = window.dashboardFilterEndDate || new Date().toISOString().split('T')[0];
            const startD = new Date(selectedStartDateStr); startD.setHours(0,0,0,0);
            const endD = new Date(selectedEndDateStr); endD.setHours(23,59,59,999);

            let todayTrx = trx.filter(t => {
                const trxDateObj = new Date(t.date);
                return trxDateObj >= startD && trxDateObj <= endD && t.status !== 'batal';
            });

            let dateRangeText = selectedStartDateStr === selectedEndDateStr ? selectedStartDateStr : `${selectedStartDateStr} s/d ${selectedEndDateStr}`;

            let modalTitle = `📋 Transaksi (${dateRangeText})`;
            let summaryText = '';
            let totalVal = 0;

            if (type === 'omset') {
                todayTrx = todayTrx.filter(t => Number(t.amountPaid) > 0);
                modalTitle = `💸 Rincian Omset (${dateRangeText})`;
                totalVal = todayTrx.reduce((sum, t) => sum + Number(t.amountPaid), 0);
                summaryText = `Total Uang Masuk: <strong class="text-emerald-600">${formatRupiah(totalVal)}</strong>`;
            } else if (type === 'piutang') {
                todayTrx = todayTrx.filter(t => (Number(t.grandTotal) - Number(t.amountPaid)) > 0);
                modalTitle = `🧾 Rincian Piutang (${dateRangeText})`;
                totalVal = todayTrx.reduce((sum, t) => sum + (Number(t.grandTotal) - Number(t.amountPaid)), 0);
                summaryText = `Total Belum Lunas: <strong class="text-red-500">${formatRupiah(totalVal)}</strong>`;
            } else {
                summaryText = `Total Nota: <strong class="text-slate-800">${todayTrx.length} Nota</strong>`;
            }

            const statusColors = {
                'antrian': 'bg-slate-100 text-slate-600 border-slate-300',
                'proses': 'bg-yellow-100 text-yellow-700 border-yellow-300',
                'siap': 'bg-blue-100 text-blue-700 border-blue-300',
                'selesai': 'bg-emerald-100 text-emerald-700 border-emerald-300'
            };

            const payColors = { 'lunas': 'text-emerald-600', 'dp': 'text-yellow-600', 'belum': 'text-red-500' };

            let listHTML = '';
            if (todayTrx.length === 0) {
                listHTML = `<div class="p-8 text-center text-slate-400 font-bold border-2 border-dashed border-slate-200 rounded-xl">Belum ada data untuk periode ini.</div>`;
            } else {
                todayTrx.forEach(t => {
                    const cust = customers.find(c => c.id === t.customerId);
                    const custName = cust ? cust.name : 'Unknown';

                    let serviceSummary = '';
                    t.items.forEach(i => {
                        const s = services.find(ser => ser.id === i.serviceId);
                        if(s) serviceSummary += `${s.name} (${i.qty}), `;
                    });
                    serviceSummary = serviceSummary.replace(/,\s*$/, '');
                    if(serviceSummary.length > 35) serviceSummary = serviceSummary.substring(0, 35) + '...';

                    const sisaTagihan = Number(t.grandTotal) - Number(t.amountPaid);

                    listHTML += `
                        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow relative">
                            <div class="flex justify-between items-start mb-2">
                                <div>
                                    <h4 class="font-bold text-slate-800 text-base">${custName}</h4>
                                    <p class="text-xs text-slate-500">${serviceSummary || 'Layanan'} • ${formatDate(t.date)}</p>
                                </div>
                                <div class="text-right">
                                    <p class="font-extrabold ${type === 'piutang' ? 'text-red-500' : 'text-blue-600'} text-base">
                                        ${type === 'piutang' ? `Kurang: ${formatRupiah(sisaTagihan)}` : (type === 'omset' ? `Masuk: ${formatRupiah(t.amountPaid)}` : formatRupiah(t.grandTotal))}
                                    </p>
                                </div>
                            </div>
                            <div class="flex items-center justify-between mt-3 text-xs font-bold gap-2 flex-wrap">
                                <div class="flex items-center gap-2">
                                    <span class="px-2 py-0.5 rounded-full border ${statusColors[t.status] || ''} uppercase text-[11px]">${t.status}</span>
                                    <span class="font-bold ${payColors[t.paymentStatus]} uppercase text-[11px]">${t.paymentStatus}</span>
                                </div>
                                <button onclick="closeModal('modal-dashboard-detail'); viewTransactionDetail('${t.id}')" class="btn-3d btn-3d-outline px-3 py-1 text-xs">Detail & Aksi</button>
                            </div>
                        </div>
                    `;
                });
            }

            const modalContent = `
                <div class="mb-3 text-xs font-bold text-slate-500 flex justify-between items-center bg-slate-50 p-2 rounded-lg border border-slate-100">
                    <span>${summaryText}</span>
                    <span class="text-right">Periode:<br><strong class="text-slate-800">${dateRangeText}</strong></span>
                </div>
                <div class="space-y-3 max-h-[60vh] overflow-y-auto pr-1 pb-2">
                    ${listHTML}
                </div>
            `;

            let container = document.getElementById('modal-dashboard-container');
            if(!container) {
                container = document.createElement('div');
                container.id = 'modal-dashboard-container';
                document.getElementById('view-container').appendChild(container);
            }
            container.innerHTML = Modal('modal-dashboard-detail', modalTitle, modalContent);
            openModal('modal-dashboard-detail');
        };

        window.openOverallDetailModal = function(type) {
            const trx = window.AppState.transactions;
            const customers = window.AppState.customers;
            const services = window.AppState.services;
            const now = new Date();

            let filteredTrx = [];
            let modalTitle = '';

            if (type === 'aktif') {
                filteredTrx = trx.filter(t => t.status !== 'batal');
                modalTitle = '🧺 Transaksi Aktif';
            } else if (type === 'proses') {
                filteredTrx = trx.filter(t => ['antrian', 'proses'].includes(t.status) && t.status !== 'batal');
                modalTitle = '⏳ Proses';
            } else if (type === 'lunas') {
                filteredTrx = trx.filter(t => t.paymentStatus === 'lunas' && t.status !== 'batal');
                modalTitle = '✅ Lunas';
            } else if (type === 'batal') {
                filteredTrx = trx.filter(t => t.status === 'batal');
                modalTitle = '❌ Batal';
            } else if (type === 'terlambat') {
                filteredTrx = trx.filter(t => {
                    if (['antrian', 'proses', 'siap'].includes(t.status) && t.status !== 'batal') {
                        let maxEst = 1;
                        t.items.forEach(i => {
                            const s = window.AppState.services.find(ser => ser.id === i.serviceId);
                            if (s && s.estimasi > maxEst) maxEst = s.estimasi;
                        });
                        const expectedDate = new Date(new Date(t.date).getTime() + (maxEst * 24 * 60 * 60 * 1000));
                        return now > expectedDate;
                    }
                    return false;
                });
                modalTitle = '⏰ Terlambat';
            }

            let summaryText = `Total Nota: <strong class="text-slate-800">${filteredTrx.length} Nota</strong>`;

            const statusColors = {
                'antrian': 'bg-slate-100 text-slate-600 border-slate-300',
                'proses': 'bg-yellow-100 text-yellow-700 border-yellow-300',
                'siap': 'bg-blue-100 text-blue-700 border-blue-300',
                'selesai': 'bg-emerald-100 text-emerald-700 border-emerald-300',
                'batal': 'bg-red-100 text-red-700 border-red-300'
            };

            const payColors = { 'lunas': 'text-emerald-600', 'dp': 'text-yellow-600', 'belum': 'text-red-500' };

            let listHTML = '';
            if (filteredTrx.length === 0) {
                listHTML = `<div class="p-8 text-center text-slate-400 font-bold border-2 border-dashed border-slate-200 rounded-xl">Belum ada data untuk kategori ini.</div>`;
            } else {
                filteredTrx.forEach(t => {
                    const cust = customers.find(c => c.id === t.customerId);
                    const custName = cust ? cust.name : 'Unknown';

                    let serviceSummary = '';
                    t.items.forEach(i => {
                        const s = services.find(ser => ser.id === i.serviceId);
                        if(s) serviceSummary += `${s.name} (${i.qty}), `;
                    });
                    serviceSummary = serviceSummary.replace(/,\s*$/, '');
                    if(serviceSummary.length > 35) serviceSummary = serviceSummary.substring(0, 35) + '...';

                    listHTML += `
                        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow relative">
                            <div class="flex justify-between items-start mb-2">
                                <div>
                                    <h4 class="font-bold text-slate-800 text-base">${custName}</h4>
                                    <p class="text-xs text-slate-500">${serviceSummary || 'Layanan'} • ${formatDate(t.date)}</p>
                                </div>
                                <div class="text-right">
                                    <p class="font-extrabold text-blue-600 text-base">
                                        ${formatRupiah(t.grandTotal)}
                                    </p>
                                </div>
                            </div>
                            <div class="flex items-center justify-between mt-3 text-xs font-bold gap-2 flex-wrap">
                                <div class="flex items-center gap-2">
                                    <span class="px-2 py-0.5 rounded-full border ${statusColors[t.status] || ''} uppercase text-[11px]">${t.status}</span>
                                    <span class="font-bold ${payColors[t.paymentStatus]} uppercase text-[11px]">${t.paymentStatus}</span>
                                </div>
                                <button onclick="closeModal('modal-dashboard-detail'); viewTransactionDetail('${t.id}')" class="btn-3d btn-3d-outline px-3 py-1 text-xs">Detail & Aksi</button>
                            </div>
                        </div>
                    `;
                });
            }

            const modalContent = `
                <div class="mb-3 text-xs font-bold text-slate-500 flex justify-between items-center bg-slate-50 p-2 rounded-lg border border-slate-100">
                    <span>${summaryText}</span>
                </div>
                <div class="space-y-3 max-h-[60vh] overflow-y-auto pr-1 pb-2">
                    ${listHTML}
                </div>
            `;

            let container = document.getElementById('modal-dashboard-container');
            if(!container) {
                container = document.createElement('div');
                container.id = 'modal-dashboard-container';
                document.getElementById('view-container').appendChild(container);
            }
            container.innerHTML = Modal('modal-dashboard-detail', modalTitle, modalContent);
            openModal('modal-dashboard-detail');
        };

        window.exportExcel = function() {
            const trx = window.AppState.transactions;
            const customers = window.AppState.customers;
            const services = window.AppState.services;

            if (trx.length === 0) return showToast("Tidak ada data untuk diexport", "warning");

            let csvContent = "ID Transaksi,Tanggal,Pelanggan,Layanan,Total Tagihan,Status Pembayaran,Jumlah Dibayar,Metode Pembayaran,Status Pengerjaan,Kasir\n";

            trx.forEach(t => {
                const cust = customers.find(c => c.id === t.customerId);
                const custName = cust ? cust.name.replace(/,/g, '') : 'Unknown';
                
                let serviceSummary = '';
                t.items.forEach(i => {
                    const s = services.find(ser => ser.id === i.serviceId);
                    if(s) serviceSummary += `${s.name} (${i.qty}) `;
                });
                serviceSummary = serviceSummary.replace(/,/g, ';').trim();

                const date = new Date(t.date).toLocaleString('id-ID').replace(/,/g, '');

                csvContent += `"${t.id}","${date}","${custName}","${serviceSummary}","${t.grandTotal}","${t.paymentStatus}","${t.amountPaid}","${t.paymentMethod || '-'}","${t.status}","${t.cashier || '-'}"\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `Laporan_Laundry_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast("Berhasil mengunduh laporan (CSV)");
        }

        window.backupData = function() {
            const dataToBackup = {
                settings: window.AppState.settings,
                services: window.AppState.services,
                customers: window.AppState.customers,
                employees: window.AppState.employees,
                transactions: window.AppState.transactions
            };
            const jsonString = JSON.stringify(dataToBackup, null, 2);
            const blob = new Blob([jsonString], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `Backup_Laundry_${new Date().toISOString().split('T')[0]}.json`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast("Berhasil membuat file backup");
        }

        window.restoreData = function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (!data.settings || !data.transactions) throw new Error("Format file tidak valid");

                    if (confirm("PERHATIAN: Memulihkan (Restore) akan menimpa/mengganti memori aplikasi di perangkat ini. Lanjutkan?")) {
                        showLoading(true);
                        
                        window.AppState.settings = data.settings || window.AppState.settings;
                        window.AppState.services = data.services || [];
                        window.AppState.customers = data.customers || [];
                        window.AppState.employees = data.employees || [];
                        window.AppState.transactions = data.transactions || [];

                        if (isOnline) {
                            await window.DB.saveSetting(window.AppState.settings);
                            showToast("Data dipulihkan ke memori lokal.", "warning");
                        } else {
                            showToast("Restore berhasil (Mode Offline)");
                        }
                        
                        renderReports(); 
                        showLoading(false);
                    }
                } catch (err) {
                    console.error(err);
                    showToast("Gagal membaca file backup", "error");
                }
            };
            reader.readAsText(file);
            event.target.value = ''; 
        }

        window.applyReportFilter = function() {
            const startVal = document.getElementById('filter-start-date')?.value;
            const endVal = document.getElementById('filter-end-date')?.value;
            const payStatusVal = document.getElementById('filter-pay-status')?.value;
            const payMethodVal = document.getElementById('filter-pay-method')?.value;

            const category = window.reportFilterState.category;
            const allTrx = window.AppState.transactions;
            const customers = window.AppState.customers;
            const services = window.AppState.services;

            let filtered = allTrx.filter(t => {
                if (category === 'masuk' && t.status === 'batal') return false;
                if (category === 'lunas' && !['lunas', 'dp'].includes(t.paymentStatus)) return false; 
                if (category === 'selesai' && t.status !== 'selesai') return false;
                if (category === 'batal' && t.status !== 'batal') return false;

                if (startVal) {
                    const dStart = new Date(startVal);
                    dStart.setHours(0,0,0,0);
                    if (new Date(t.date) < dStart) return false;
                }
                if (endVal) {
                    const dEnd = new Date(endVal);
                    dEnd.setHours(23,59,59,999);
                    if (new Date(t.date) > dEnd) return false;
                }

                if (payStatusVal !== 'semua') {
                    if (payStatusVal === 'lunas' && !['lunas', 'dp'].includes(t.paymentStatus)) return false;
                    if (payStatusVal === 'belum' && !['belum', 'dp'].includes(t.paymentStatus)) return false;
                    if (payStatusVal === 'dp' && t.paymentStatus !== 'dp') return false;
                }

                if (payMethodVal !== 'semua' && (t.paymentMethod || 'Tunai') !== payMethodVal) return false;

                return true;
            });

            let totalSum = 0;
            let html = '';

            if (filtered.length === 0) {
                const listContainer = document.getElementById('report-items-list');
                if (listContainer) {
                    listContainer.innerHTML = `<div class="p-6 text-center text-slate-400 font-bold border-2 border-dashed border-slate-200 rounded-xl">Tidak ada transaksi yang cocok.</div>`;
                }
                document.getElementById('report-total-amount').innerText = formatRupiah(0);
                document.getElementById('report-total-count').innerText = `0 Transaksi Terfilter`;
                return;
            }

            filtered.forEach(t => {
                let itemAmount = Number(t.grandTotal || 0);
                let sisaBelumBayar = Number(t.grandTotal || 0) - Number(t.amountPaid || 0);

                if (payStatusVal === 'lunas') itemAmount = Number(t.amountPaid || 0);
                else if (payStatusVal === 'belum') itemAmount = sisaBelumBayar;
                else if (payStatusVal === 'dp') itemAmount = Number(t.amountPaid || 0);

                totalSum += itemAmount;

                const cust = customers.find(c => c.id === t.customerId);
                const custName = cust ? cust.name : 'Unknown';

                let serviceSummary = '';
                t.items.forEach(i => {
                    const s = services.find(ser => ser.id === i.serviceId);
                    if(s) serviceSummary += `${s.name} (${i.qty}), `;
                });
                serviceSummary = serviceSummary.replace(/,\s*$/, '');
                if(serviceSummary.length > 30) serviceSummary = serviceSummary.substring(0, 30) + '...';

                const payBadgeColor = t.paymentStatus === 'lunas' ? 'text-emerald-600 bg-emerald-50' : (t.paymentStatus === 'dp' ? 'text-yellow-600 bg-yellow-50' : 'text-red-500 bg-red-50');

                html += `
                    <div class="bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-between gap-2">
                        <div class="flex justify-between items-start">
                            <div>
                                <h4 class="font-bold text-slate-800 text-sm">${custName}</h4>
                                <p class="text-xs text-slate-500">${serviceSummary || 'Layanan'} • ${formatDate(t.date)}</p>
                            </div>
                            <div class="text-right">
                                <p class="font-extrabold text-blue-600 text-sm">${formatRupiah(itemAmount)}</p>
                            </div>
                        </div>
                        <div class="flex items-center justify-between text-xs font-bold pt-2 border-t border-slate-100">
                            <span class="px-2 py-0.5 rounded-lg ${payBadgeColor} uppercase text-[11px]">
                                ${t.status} • Bayar: ${formatRupiah(t.amountPaid)} (${t.paymentStatus} / ${t.paymentMethod || 'Tunai'})
                            </span>
                            <button onclick="closeModal('modal-report-filter'); viewTransactionDetail('${t.id}')" class="text-blue-600 hover:underline">Detail ➔</button>
                        </div>
                    </div>
                `;
            });

            const amountEl = document.getElementById('report-total-amount');
            const countEl = document.getElementById('report-total-count');
            if(amountEl) amountEl.innerText = formatRupiah(totalSum);
            if(countEl) countEl.innerText = `${filtered.length} Transaksi Terfilter`;

            const listContainer = document.getElementById('report-items-list');
            if(listContainer) listContainer.innerHTML = html;
        };

        // ------------- COMPONENT: PRINTING & SHARING -------------
        function generateEscPosBytes(trxId = null) {
            let s = window.AppState.settings;
            let trx = trxId ? window.AppState.transactions.find(t => t.id === trxId) : {
                id: 'TEST01', date: new Date().toISOString(), cashier: 'Admin', paymentStatus: 'lunas', grandTotal: 34000, amountPaid: 35000, parfum: 'Standard', items: [{serviceId: 'dummy1', qty: 2, price: 6000, total: 12000}]
            };
            let cust = trxId ? window.AppState.customers.find(c => c.id === trx?.customerId) : {name: 'Pelanggan Demo'};

            const encoder = new TextEncoder();
            let buffer = [];

            const addText = (text) => buffer.push(...encoder.encode(text));
            const INIT = [0x1B, 0x40];
            const ALIGN_CENTER = [0x1B, 0x61, 0x01];
            const ALIGN_LEFT = [0x1B, 0x61, 0x00];
            const BOLD_ON = [0x1B, 0x45, 0x01];
            const BOLD_OFF = [0x1B, 0x45, 0x00];
            const LF = [0x0A];

            const line = "--------------------------------\n";
            const doubleLine = "================================\n";

            buffer.push(...INIT);
            buffer.push(...ALIGN_CENTER);
            buffer.push(...BOLD_ON);
            if(s.showLogo !== false) addText((s.outletName || "LAUNDRY").toUpperCase() + "\n");
            buffer.push(...BOLD_OFF);
            if(s.showAddress !== false && s.address) addText(s.address + "\n");
            if(s.showPhone !== false && s.phone) addText("Telp: " + s.phone + "\n");
            addText(line);

            buffer.push(...ALIGN_LEFT);
            const fmtDate = (dateStr) => {
                const d = new Date(dateStr);
                return d.toLocaleDateString('id-ID', {day:'2-digit', month:'2-digit', year:'2-digit'}) + ' ' + d.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'}).replace('.', ':');
            };

            addText(`Nota: #${trx.id.substring(0,8).toUpperCase()}\n`);
            addText(`Tgl : ${fmtDate(trx.date)}\n`);
            if (s.showCustomerName !== false) addText(`Plg : ${(cust?.name || 'Umum').substring(0,25)}\n`);
            if (s.showCashierName !== false) addText(`Ksr : ${(trx.cashier || 'Admin').substring(0,25)}\n`);
            if (s.showParfum !== false) addText(`Prf : ${(trx.parfum || 'Standard').substring(0,25)}\n`);
            addText(line);

            trx.items.forEach(i => {
                let name = 'Item';
                if (trxId) {
                    const srv = window.AppState.services.find(ser => ser.id === i.serviceId);
                    if (srv) name = srv.name;
                } else {
                    name = i.serviceId === 'dummy1' ? 'Cuci Komplit (Kg)' : 'Bed Cover Besar (Pcs)';
                }
                addText(`${name.substring(0,32)}\n`);
                let leftStr = ` ${i.qty} x ${i.price.toLocaleString('id-ID')}`;
                let rightStr = i.total.toLocaleString('id-ID');
                let spaceCount = 32 - leftStr.length - rightStr.length;
                if(spaceCount < 1) spaceCount = 1;
                addText(leftStr + " ".repeat(spaceCount) + rightStr + "\n");
            });

            addText(line);
            
            let gTotalStr = trx.grandTotal.toLocaleString('id-ID');
            addText("TOTAL" + " ".repeat(32 - 5 - gTotalStr.length) + gTotalStr + "\n");

            if (trx.paymentStatus !== 'belum') {
                let paidStr = trx.amountPaid.toLocaleString('id-ID');
                addText("BAYAR" + " ".repeat(32 - 5 - paidStr.length) + paidStr + "\n");
            }

            if (trx.paymentStatus === 'dp') {
                let sisaStr = (trx.grandTotal - trx.amountPaid).toLocaleString('id-ID');
                addText("SISA " + " ".repeat(32 - 5 - sisaStr.length) + sisaStr + "\n");
            } else if (trx.paymentStatus === 'lunas' && trx.amountPaid > trx.grandTotal) {
                let kemStr = (trx.amountPaid - trx.grandTotal).toLocaleString('id-ID');
                addText("KEMBALI" + " ".repeat(32 - 7 - kemStr.length) + kemStr + "\n");
            }

            let statStr = trx.paymentStatus.toUpperCase();
            addText("STATUS" + " ".repeat(32 - 6 - statStr.length) + statStr + "\n");
            addText(doubleLine);

            if (s.receiptFooter) {
                buffer.push(...ALIGN_CENTER);
                addText(s.receiptFooter + "\n");
            }
            
            buffer.push(...ALIGN_CENTER);
            addText("- - - - - - - - - - - - -\n");
            
            buffer.push(...LF, ...LF, ...LF, ...LF); 
            
            return new Uint8Array(buffer);
        }

        window.executePrint = async function() {
            const trxId = window.currentPreviewTrxId;

            if (!navigator.bluetooth) {
                showToast("Browser tidak mendukung Web Bluetooth API. Mencetak lewat PDF...", "warning");
                if (window.currentPrintContent) {
                    document.getElementById('print-area').innerHTML = window.currentPrintContent;
                    closeModal('modal-receipt-preview');
                    setTimeout(() => { window.print(); }, 500);
                }
                return;
            }

            try {
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb', 'e7810a71-73ae-499d-8c15-faa9aef0c3f2'] 
                });

                showToast("Menghubungkan ke printer...", "success");
                const server = await device.gatt.connect();
                const services = await server.getPrimaryServices();
                let printCharacteristic = null;

                for (let service of services) {
                    const characteristics = await service.getCharacteristics();
                    for (let characteristic of characteristics) {
                        if (characteristic.properties.write || characteristic.properties.writeWithoutResponse) {
                            printCharacteristic = characteristic;
                            break;
                        }
                    }
                    if (printCharacteristic) break;
                }

                if (!printCharacteristic) {
                    throw new Error("Karakteristik cetak tidak ditemukan.");
                }

                const dataToPrint = generateEscPosBytes(trxId);
                const chunkSize = 512;

                for (let i = 0; i < dataToPrint.length; i += chunkSize) {
                    const chunk = dataToPrint.slice(i, i + chunkSize);
                    await printCharacteristic.writeValue(chunk);
                }

                showToast("Berhasil mencetak nota ke printer!", "success");
                closeModal('modal-receipt-preview');

            } catch (error) {
                console.error(error);
                if (error.name === 'NotFoundError') {
                     showToast("Pencarian Bluetooth dibatalkan pengguna.", "error");
                } else if (error.name === 'SecurityError') {
                     showToast("Pastikan Anda menggunakan HTTPS.", "error");
                } else {
                     showToast("Gagal mencetak: " + error.message, "error");
                }
            }
        };

            text += `Nota : #${trx.id.substring(0,8).toUpperCase()}\n`;
            text += `Tgl  : ${formatDate(trx.date)}\n`;
            if (settings.showCustomerName !== false) text += `Plg  : ${cust ? cust.name : 'Umum'}\n`;
            if (settings.showCashierName !== false) text += `Ksr  : ${trx.cashier || 'Admin'}\n`;
            text += l2;

            trx.items.forEach(i => {

            });
            
            text += l1;
            text += `TOTAL       : ${formatRupiah(trx.grandTotal)}\n`;
            
            if(trx.paymentStatus === 'dp') {
                text += `T'LAH DIBAYAR: ${formatRupiah(trx.amountPaid)}\n`;

            text += `STATUS      : ${trx.paymentStatus.toUpperCase()}\n`;
            text += l1;
            
            if(settings.receiptFooter) text += `${settings.receiptFooter}\n`;

            if (navigator.share) {
                try {
                    await navigator.share({
                        title: `Nota - ${settings.outletName}`,

                    });
                    showToast("Nota berhasil dibagikan!");

            } else {

                } catch (err) {
                    let phone = cust?.phone || '';
                    if(phone.startsWith('0')) phone = '62' + phone.substring(1);

                        showToast("Fitur share tidak didukung browser", "error");

        };

            const data = { name: document.getElementById('cust_name').value, phone: document.getElementById('cust_phone').value, address: document.getElementById('cust_address').value };
            if(!data.name || !data.phone) return showToast("Nama dan Nomor WhatsApp wajib diisi", "error");
            await window.DB.addCustomer(data);
            closeModal('modal-customer');
            renderCustomers();
        }

        // ------------- COMPONENT: EMPLOYEES -------------
        function renderEmployees() {
            const container = document.getElementById('view-container');
            const data = window.AppState.employees;

            let rows = '';
            data.forEach(item => {
                rows += `
                    <tr class="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                        <td class="p-4 font-bold text-slate-800 flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-slate-200 text-slate-600 flex items-center justify-center font-bold shadow-sm shrink-0">👷</div>
                            ${item.name}
                        </td>
                        <td class="p-4 text-slate-600 font-bold"><span class="bg-slate-100 px-3 py-1 rounded-lg text-xs uppercase shadow-sm">${item.role || 'Staf'}</span></td>
                        <td class="p-4 text-slate-500 font-mono text-sm">${item.phone || '-'}</td>
                    </tr>
                `;
            });

            container.innerHTML = `
                <div class="flex justify-between items-center mb-6">
                    <h1 class="text-3xl font-extrabold text-slate-800">Data Karyawan</h1>
                    <button onclick="openEmployeeForm()" class="btn-3d btn-3d-primary px-4 py-2 font-bold text-sm">➕ Tambah</button>
                </div>
                <div class="card-3d overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse min-w-[500px]">
                            <thead>
                                <tr class="bg-slate-100/50 text-slate-500 text-sm uppercase tracking-wider border-b border-slate-200">
                                    <th class="p-4 font-extrabold">Nama Karyawan</th>
                                    <th class="p-4 font-extrabold">Posisi / Jabatan</th>
                                    <th class="p-4 font-extrabold">Kontak WA</th>
                                </tr>
                            </thead>
                            <tbody>${rows || '<tr><td colspan="3" class="p-8 text-center text-slate-400 font-bold">Belum ada karyawan</td></tr>'}</tbody>
                        </table>
                    </div>
                </div>
                <div id="modal-employee-container"></div>
            `;
        }
        
        window.openEmployeeForm = function() {
            const formHTML = `
                <form id="form-emp" class="space-y-4">
                    <div><label class="block text-sm font-bold text-slate-600 mb-1">Nama Karyawan</label>
                    <input type="text" id="emp_name" class="input-3d w-full font-bold text-slate-700" required></div>
                    
                    <div><label class="block text-sm font-bold text-slate-600 mb-1">Posisi / Jabatan</label>
                    <input type="text" id="emp_role" class="input-3d w-full" placeholder="Kasir, Bagian Cuci, dll"></div>
                    
                    <div><label class="block text-sm font-bold text-slate-600 mb-1">No. WhatsApp</label>
                    <input type="text" id="emp_phone" class="input-3d w-full font-bold text-slate-700" placeholder="08..."></div>
                </form>
            `;
            const actions = `<button onclick="saveEmployee()" class="btn-3d btn-3d-primary px-6 py-2 font-bold w-full sm:w-auto">Simpan Karyawan</button>`;
            
            document.getElementById('modal-employee-container').innerHTML = Modal('modal-employee', 'Tambah Karyawan Baru', formHTML, actions);
            openModal('modal-employee');
        }

        window.saveEmployee = async function() {
            const data = { name: document.getElementById('emp_name').value, role: document.getElementById('emp_role').value || 'Staf', phone: document.getElementById('emp_phone').value };
            if(!data.name) return showToast("Nama karyawan wajib diisi", "error");
            await window.DB.addEmployee(data);
            closeModal('modal-employee');
            renderEmployees();
        }

        // ------------- COMPONENT: SETTINGS -------------
        function renderSettings() {
            const container = document.getElementById('view-container');
            const s = window.AppState.settings;

            container.innerHTML = `
                <h1 class="text-3xl font-extrabold text-slate-800 mb-6">Pengaturan Sistem & Nota</h1>
                
                <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
                    <div class="lg:col-span-8 space-y-6">
                        <div class="card-3d p-6">
                            <h3 class="font-extrabold text-lg text-slate-700 border-b border-slate-100 pb-3 mb-4 flex items-center gap-2">🏪 Profil Outlet Laundry</h3>
                            <div class="space-y-4">
                                <div>
                                    <label class="block text-sm font-bold text-slate-600 mb-1">Nama Outlet / Toko</label>
                                    <input type="text" id="set_name" value="${s.outletName}" class="input-3d w-full font-bold text-slate-800">
                                </div>
                                <div>
                                    <label class="block text-sm font-bold text-slate-600 mb-1">Alamat Lengkap Outlet</label>
                                    <textarea id="set_address" class="input-3d w-full h-20 resize-none">${s.address}</textarea>
                                </div>
                                <div>
                                    <label class="block text-sm font-bold text-slate-600 mb-1">No. Telp / WhatsApp Outlet</label>
                                    <input type="text" id="set_phone" value="${s.phone}" class="input-3d w-full font-bold text-slate-800">
                                </div>
                            </div>
                        </div>

                        <div class="card-3d p-6">
                            <h3 class="font-extrabold text-lg text-slate-700 border-b border-slate-100 pb-3 mb-4 flex items-center gap-2">🖨️ Kustomisasi Komponen Nota 58mm</h3>
                            <p class="text-xs text-slate-500 mb-4 font-bold">Centang komponen yang ingin ditampilkan pada struk cetak:</p>
                            
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-5">
                                <label class="flex items-center gap-3 p-3 bg-slate-50 rounded-xl border border-slate-200 cursor-pointer hover:bg-blue-50 hover:border-blue-200 transition">
                                    <input type="checkbox" id="chk_logo" class="w-5 h-5 accent-blue-500" ${s.showLogo !== false ? 'checked' : ''}>
                                    <span class="font-bold text-sm text-slate-700">Nama Toko (Header)</span>
                                </label>
                                <label class="flex items-center gap-3 p-3 bg-slate-50 rounded-xl border border-slate-200 cursor-pointer hover:bg-blue-50 hover:border-blue-200 transition">
                                    <input type="checkbox" id="chk_address" class="w-5 h-5 accent-blue-500" ${s.showAddress !== false ? 'checked' : ''}>
                                    <span class="font-bold text-sm text-slate-700">Alamat Outlet</span>
                                </label>
                                <label class="flex items-center gap-3 p-3 bg-slate-50 rounded-xl border border-slate-200 cursor-pointer hover:bg-blue-50 hover:border-blue-200 transition">
                                    <input type="checkbox" id="chk_phone" class="w-5 h-5 accent-blue-500" ${s.showPhone !== false ? 'checked' : ''}>
                                    <span class="font-bold text-sm text-slate-700">No. Telp Outlet</span>
                                </label>
                                <label class="flex items-center gap-3 p-3 bg-slate-50 rounded-xl border border-slate-200 cursor-pointer hover:bg-blue-50 hover:border-blue-200 transition">
                                    <input type="checkbox" id="chk_cust" class="w-5 h-5 accent-blue-500" ${s.showCustomerName !== false ? 'checked' : ''}>
                                    <span class="font-bold text-sm text-slate-700">Nama Pelanggan</span>
                                </label>
                                <label class="flex items-center gap-3 p-3 bg-slate-50 rounded-xl border border-slate-200 cursor-pointer hover:bg-blue-50 hover:border-blue-200 transition">
                                    <input type="checkbox" id="chk_cashier" class="w-5 h-5 accent-blue-500" ${s.showCashierName !== false ? 'checked' : ''}>
                                    <span class="font-bold text-sm text-slate-700">Nama Kasir</span>
                                </label>
                                <label class="flex items-center gap-3 p-3 bg-slate-50 rounded-xl border border-slate-200 cursor-pointer hover:bg-blue-50 hover:border-blue-200 transition">
                                    <input type="checkbox" id="chk_parfum" class="w-5 h-5 accent-blue-500" ${s.showParfum !== false ? 'checked' : ''}>
                                    <span class="font-bold text-sm text-slate-700">Info Parfum</span>
                                </label>
                            </div>

                            <div>
                                <label class="block text-sm font-bold text-slate-600 mb-1">Pesan Penutup / Syarat Ketentuan (Footer)</label>
                                <textarea id="set_footer" class="input-3d w-full h-24 resize-none text-sm p-3 leading-relaxed">${s.receiptFooter}</textarea>
                            </div>
                        </div>
                        
                        <div class="flex justify-end pt-2 pb-6">
                            <button onclick="saveSettingsForm()" class="btn-3d btn-3d-primary px-8 py-3 w-full sm:w-auto text-lg font-bold shadow-[0_10px_20px_rgba(59,130,246,0.3)]">💾 Simpan Semua Pengaturan</button>
                        </div>
                    </div>

                    <div class="lg:col-span-4 space-y-6">
                        <div class="card-3d p-6 bg-gradient-to-br from-slate-800 to-slate-900 text-white border-0 sticky top-8 shadow-2xl">
                            <h3 class="font-extrabold text-xl mb-3 flex items-center gap-2 text-blue-300">🖨️ Printer Bluetooth (Thermal)</h3>
                            <p class="text-slate-300 text-sm mb-4 leading-relaxed font-semibold">Telah menggunakan Web Bluetooth API untuk otomatis mencari dan memprint struk secara *direct* melalui printer thermal Anda.</p>
                            
                            <div class="bg-slate-800/60 p-4 rounded-xl border border-slate-700 shadow-inner">
                                <p class="text-xs text-slate-400 mb-3 text-center">Lihat pratinjau nota berdasarkan isian form saat ini sebelum Anda menyimpannya.</p>
                                <button onclick="testPrint()" class="btn-3d bg-blue-500 text-white hover:bg-blue-400 px-4 py-3 w-full font-bold flex items-center justify-center gap-2 shadow-lg shadow-blue-500/30">
                                    👁️ Buka Pratinjau Nota
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        window.saveSettingsForm = async function() {
            const data = {
                outletName: document.getElementById('set_name').value,
                address: document.getElementById('set_address').value,
                phone: document.getElementById('set_phone').value,
                receiptFooter: document.getElementById('set_footer').value,
                showLogo: document.getElementById('chk_logo').checked,
                showAddress: document.getElementById('chk_address').checked,
                showPhone: document.getElementById('chk_phone').checked,
                showCustomerName: document.getElementById('chk_cust').checked,
                showCashierName: document.getElementById('chk_cashier').checked,
                showParfum: document.getElementById('chk_parfum').checked
            };
            await window.DB.saveSetting(data);
        }

        window.testPrint = function() {
            const tempSettings = {
                outletName: document.getElementById('set_name').value,
                address: document.getElementById('set_address').value,
                phone: document.getElementById('set_phone').value,
                receiptFooter: document.getElementById('set_footer').value,
                showLogo: document.getElementById('chk_logo').checked,
                showAddress: document.getElementById('chk_address').checked,
                showPhone: document.getElementById('chk_phone').checked,
                showCustomerName: document.getElementById('chk_cust').checked,
                showCashierName: document.getElementById('chk_cashier').checked,
                showParfum: document.getElementById('chk_parfum').checked
            };
            const oldSettings = {...window.AppState.settings};
            window.AppState.settings = {...oldSettings, ...tempSettings};
            previewReceipt(null);
            window.AppState.settings = oldSettings;
        };
    </script>
</body>
</html>
